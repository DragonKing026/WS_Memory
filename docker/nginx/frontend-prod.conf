# Serwowanie zbudowanego frontendu w produkcji.
#
# Ten plik jest używany WYŁĄCZNIE w obrazie `prod` frontendu (osobny nginx obok
# aplikacji). Główny nginx projektu kieruje do niego ruch z `/`.

server {
    # 5173, nie 80 — ten sam port co serwer Vite w dev, więc główny nginx ma jeden
    # adres nadrzędny niezależnie od trybu (patrz docker/nginx/default.conf).
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Zasoby z hashem w nazwie są niezmienne — Vite gwarantuje nową nazwę przy każdej
    # zmianie treści, więc rok cache'u jest bezpieczny i oszczędza każde wejście.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Historia przeglądarki: każda ścieżka nieistniejąca jako plik to trasa aplikacji.
    # Bez tego odświeżenie strony na /s/projekt/dokument daje 404 od nginxa.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html NIE jest cache'owany: to on wskazuje na aktualne hashe zasobów,
        # więc jego stara kopia oznacza aplikację, która ładuje pliki, których już nie ma.
        add_header Cache-Control "no-cache";
    }
}
