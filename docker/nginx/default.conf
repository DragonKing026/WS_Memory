# Jedyne wejście do systemu (D-006).
#
#   /            → frontend (dojdzie w TODO-006; na razie komunikat)
#   /api         → backend, REST dla frontendu
#   /mcp         → backend, gateway MCP dla agentów AI
#
# Backend i frontend są rozdzielone (D-008), ale stoją na JEDNYM origin —
# dzięki temu przeglądarka nigdy nie wykonuje żądania międzydomenowego i nie
# ma czego konfigurować w CORS.

upstream backend {
    server backend:9000;
}

server {
    listen 80;
    # Bez tego healthcheck pytający o „localhost" dostaje odmowę połączenia:
    # w kontenerze localhost rozwiązuje się najpierw na ::1, a samo `listen 80`
    # wiąże wyłącznie IPv4.
    listen [::]:80;
    server_name _;

    root /app/public;

    # Limit rozmiaru żądania: publikacja partii szuflad z lokalnych pałaców
    # (TODO-012) potrafi być spora, ale nie nieograniczona.
    client_max_body_size 32m;

    location = /health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    location ~ ^/(api|mcp) {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Publikacja partii i wyszukiwanie semantyczne bywają wolniejsze niż
        # zwykłe żądanie — liczenie wektorów po stronie serwera trwa.
        fastcgi_read_timeout 120s;
        internal;
    }

    location / {
        return 503 "Frontend jeszcze nie istnieje — TODO-006.\n";
        add_header Content-Type text/plain;
    }
}
