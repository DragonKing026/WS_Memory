# Jedyne wejście do systemu (D-006).
#
#   /            → frontend (Vite w dev, statyczne dist/ w produkcji)
#   /api         → backend, REST dla frontendu
#   /mcp         → backend, gateway MCP dla agentów AI
#
# Backend i frontend są rozdzielone (D-008), ale stoją na JEDNYM origin —
# dzięki temu przeglądarka nigdy nie wykonuje żądania międzydomenowego i nie
# ma czego konfigurować w CORS.

# Websocket wymaga „Connection: upgrade" tylko wtedy, gdy klient o to poprosił —
# stała wartość zepsułaby zwykłe żądania HTTP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend {
    server backend:9000;
}

# W dev to serwer Vite, w produkcji nginx z obrazu frontendu — i w obu przypadkach
# port 5173. Ten plik jest montowany, nie przetwarzany szablonem, więc zmienna tutaj
# nie zostałaby podstawiona; wyrównanie portu po stronie frontendu usuwa całą tę
# rozbieżność zamiast ją konfigurować.
upstream frontend {
    server frontend:5173;
}

server {
    listen 80;
    # Bez tego healthcheck pytający o „localhost" dostaje odmowę połączenia:
    # w kontenerze localhost rozwiązuje się najpierw na ::1, a samo `listen 80`
    # wiąże wyłącznie IPv4.
    listen [::]:80;
    server_name _;

    root /app/public;

    # Limit rozmiaru żądania: publikacja partii szuflad z lokalnych pałaców
    # (TODO-012) potrafi być spora, ale nie nieograniczona.
    client_max_body_size 32m;

    location = /health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    location ~ ^/(api|mcp) {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Publikacja partii i wyszukiwanie semantyczne bywają wolniejsze niż
        # zwykłe żądanie — liczenie wektorów po stronie serwera trwa.
        fastcgi_read_timeout 120s;
        internal;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        # Websocket HMR Vite chodzi po tym samym porcie co strona. Bez tych dwóch
        # nagłówków przeglądarka dostaje 400 przy uścisku dłoni, a zmiana pliku
        # przestaje być widoczna bez ręcznego odświeżenia.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite przy pierwszym żądaniu potrafi dociągać i przetwarzać zależności.
        proxy_read_timeout 90s;
    }
}
