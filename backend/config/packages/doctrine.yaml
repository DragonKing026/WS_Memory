doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Hide the palace schema from Doctrine: without this it would see
        # MemPalace's tables and a future diff would propose dropping them
        # (D-002, D-004).
        #
        # Phrased as "everything except palace" rather than "only ws" on
        # purpose. The application role runs with `search_path = ws, public`,
        # so DBAL returns our own tables UNQUALIFIED — a `^ws\.` filter
        # rejects them, and Doctrine then fails to find its own migrations
        # table and tries to create it again. Palace tables are outside the
        # search path, so they always arrive schema-qualified and this pattern
        # catches them.
        schema_filter: '~^(?!palace\.)~'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        auto_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            # `proxy_dir` tu NIE MA i to jest poprawka, nie przeoczenie.
            # DoctrineBundle 3 usunął tę opcję (proxy idą do katalogu build
            # same), a wpis został z przepisu Symfony dla wersji 2. Nikt tego
            # nie zauważył, bo błąd wychodzi wyłącznie przy `cache:warmup
            # --env=prod`, czyli przy budowaniu obrazu produkcyjnego — a przez
            # cały czas pracy budowany był tylko obraz dev. Wyszło dopiero
            # przy pierwszej prawdziwej instalacji w trybie prod (TODO-018).
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool
    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
