framework:
    messenger:
        failure_transport: failed

        transports:
            # Transport w bazie: jedna usługa mniej do postawienia i
            # utrzymania, a przy naszej skali (kilkanaście osób) Postgres
            # spokojnie to udźwignie. Kolejka mieszka w schemacie ws.
            #
            # auto_setup=0, bo tabelę tworzy migracja — nie chcemy, żeby
            # aplikacja modyfikowała schemat w locie na produkcji.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    table_name: ws.messenger_messages
                    auto_setup: false
                retry_strategy:
                    max_retries: 3
                    delay: 2000
                    multiplier: 3
            # Ta sama tabela, inna kolejka — nieudane zadania nie znikają,
            # ale też nie potrzebują osobnego magazynu.
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    table_name: ws.messenger_messages
                    queue_name: failed
                    auto_setup: false

        routing:
            # Publikacja dokumentu do pałaca idzie w tło, bo policzenie wektora dla
            # całego dokumentu trwa sekundy, a człowiek naciskający „zapisz" nie ma
            # na co czekać. Zadanie jest idempotentne i odrzuca zlecenia dla
            # nieaktualnej rewizji, więc kolejność dostarczenia nie ma znaczenia.
            App\Application\Document\PublishDocument: async
            # Wysyłka maila w tle, bo niedostępny serwer poczty nie może zawieszać
            # ani wywracać żądania, które wystawia zaproszenie. Ponowienia bierze
            # transport (trzy próby z narastającym odstępem), a dziennik maili
            # pokazuje ich liczbę.
            #
            # UWAGA: ta wiadomość zawiera działający token zaproszenia, więc jej
            # wiersz w ws.messenger_messages jest czasową kopią poświadczenia
            # (D-038). Wiadomość, która nie przeszła wszystkich ponowień, ląduje
            # w kolejce `failed` i zostaje tam z tokenem w środku — dlatego
            # retencja w docs/05-deployment.md każe tę kolejkę czyścić.
            App\Application\Mail\SendMail: async
