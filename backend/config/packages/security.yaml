security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        # Health is polled by Docker and by monitoring, which carry no token
        # and must not need one: behind authentication, an auth outage would be
        # indistinguishable from a total outage.
        health:
            pattern: ^/api/health$
            security: false

        login:
            pattern: ^/api/login$
            stateless: true
            user_checker: App\Infrastructure\Security\ActiveAccountChecker
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Agents authenticate with their own credential, not a JWT: it has to
        # live for months, die the moment somebody says so, and carry a scope
        # that narrows its owner's permissions. A JWT does none of those
        # (docs/03). Declared before `api` so the JWT listener never sees /mcp.
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: app_users
            # Runs on every request here too: a deactivated owner's agents must
            # stop working without anybody revoking their tokens one by one.
            user_checker: App\Infrastructure\Security\ActiveAccountChecker
            custom_authenticators:
                - App\Infrastructure\Security\AgentTokenAuthenticator

        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            # Runs on every authenticated request, not only at sign-in: a JWT
            # stays valid until it expires, so a deactivated account would keep
            # its access without this.
            user_checker: App\Infrastructure\Security\ActiveAccountChecker
            # Two credentials on one firewall, and only one route where both are
            # accepted: /api/publish. The sender there is an outbox running
            # unattended on a laptop (D-015), which cannot hold an eight-hour JWT.
            # The authenticator claims a request only when the path is that route
            # AND the Bearer value carries the `wsm_` prefix, so it never answers
            # for a signed-in person (D-036). Declared before `jwt` on purpose:
            # authenticators are tried in order.
            custom_authenticators:
                - App\Infrastructure\Security\AgentTokenAuthenticator
            jwt: ~

    access_control:
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/invitations/accept, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/mcp, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # The real hasher is deliberately slow, which is right in
            # production and wasteful across a test suite that signs in
            # constantly. Lowered cost here only.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
