# Application service wiring.
#
# WS_Memory is a pure API (D-008) — nothing here renders a user interface.
# The frontend is a separate application talking to /api.
#
# Layers: Presentation -> Application -> Domain, with Infrastructure
# implementing ports declared in Domain. Dependencies point inwards only
# (see AGENTS.md).

parameters:
    mempalace.base_url: '%env(MEMPALACE_URL)%'
    # The shared token to the palace. Known to the backend and to nothing else:
    # an agent authenticates against /mcp with its own token and never sees this
    # one (inviolable rule 1).
    mempalace.token: '%env(MEMPALACE_MCP_HTTP_TOKEN)%'
    # Kept short on purpose. A write holds a database transaction open while it
    # waits for this call, so a generous timeout would mean a long-held row lock
    # rather than a more reliable write.
    mempalace.timeout: '%env(float:MEMPALACE_TIMEOUT)%'
    # Public address used in invitation links. In development it is the local
    # nginx; in production the real domain.
    app.public_base_url: '%env(default:app_default_base_url:WS_PUBLIC_URL)%'
    app_default_base_url: 'http://127.0.0.1:8080'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/**/{Entity,ValueObject}'
            - '../src/Kernel.php'

    # Health probes are collected by tag: monitoring another dependency means
    # adding a class, not editing the controller.
    _instanceof:
        App\Domain\Health\HealthProbe:
            tags: ['app.health_probe']

    App\Domain\Health\HealthChecker:
        arguments:
            $probes: !tagged_iterator app.health_probe

    App\Infrastructure\MemPalace\MemPalaceHealthProbe:
        arguments:
            $baseUrl: '%mempalace.base_url%'

    # Ports and the adapters behind them. Symfony can infer the alias while
    # exactly one class implements an interface; written down, a second adapter
    # — a cache, a read-only double — becomes a one-line change here instead of
    # a container that suddenly cannot decide.
    App\Domain\Memory\MemoryStore: '@App\Infrastructure\MemPalace\McpMemoryStore'
    App\Domain\Memory\MemoryRegistry: '@App\Infrastructure\Doctrine\DoctrineMemoryRegistry'
    App\Domain\Space\SpaceCatalog: '@App\Infrastructure\Doctrine\DoctrineSpaceCatalog'
    App\Domain\Space\SpaceMembershipRepository: '@App\Infrastructure\Doctrine\DoctrineSpaceMembershipRepository'
    App\Domain\Audit\AuditTrail: '@App\Infrastructure\Doctrine\DoctrineAuditTrail'

    App\Infrastructure\MemPalace\MemPalaceClient:
        arguments:
            $baseUrl: '%mempalace.base_url%'
            $token: '%mempalace.token%'
            $timeoutSeconds: '%mempalace.timeout%'

    App\Presentation\Console\InviteUserCommand:
        arguments:
            $publicBaseUrl: '%app.public_base_url%'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # Symfony removes services nothing references yet, and a use case
        # reachable only from a test looks exactly like that. We expose the few
        # the tests reach for, by name.
        #
        # Deliberately NOT a blanket `public: true` on App\: that turns every
        # value object and DTO into a service and the container then fails on
        # constructors it cannot autowire — SpaceId(string $value) and the like.
        App\Application\Invitation\IssueInvitation:
            public: true
        App\Application\Invitation\AcceptInvitation:
            public: true
        App\Domain\Space\SpaceAccessResolver:
            public: true
        App\Application\Memory\MemoryService:
            public: true
        App\Domain\Memory\MemoryRegistry: '@App\Infrastructure\Doctrine\DoctrineMemoryRegistry'
        App\Domain\Space\SpaceCatalog: '@App\Infrastructure\Doctrine\DoctrineSpaceCatalog'
