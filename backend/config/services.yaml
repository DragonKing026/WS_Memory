# Application service wiring.
#
# WS_Memory is a pure API (D-008) — nothing here renders a user interface.
# The frontend is a separate application talking to /api.
#
# Layers: Presentation -> Application -> Domain, with Infrastructure
# implementing ports declared in Domain. Dependencies point inwards only
# (see AGENTS.md).

parameters:
    mempalace.base_url: '%env(MEMPALACE_URL)%'
    # The shared token to the palace. Known to the backend and to nothing else:
    # an agent authenticates against /mcp with its own token and never sees this
    # one (inviolable rule 1).
    mempalace.token: '%env(MEMPALACE_MCP_HTTP_TOKEN)%'
    # Kept short on purpose. A write holds a database transaction open while it
    # waits for this call, so a generous timeout would mean a long-held row lock
    # rather than a more reliable write.
    mempalace.timeout: '%env(float:MEMPALACE_TIMEOUT)%'
    # Calls one agent token may make per minute. Counted in the database next to
    # `last_used_at`, so the limit holds across several backend containers (D-022).
    mcp.calls_per_minute: '%env(int:MCP_CALLS_PER_MINUTE)%'
    # Public address used in invitation links. In development it is the local
    # nginx; in production the real domain.
    app.public_base_url: '%env(default:app_default_base_url:WS_PUBLIC_URL)%'
    app_default_base_url: 'http://127.0.0.1:8080'
    # Where the instruction texts published as MCP resources are read from. They
    # have one source — `plugin/shared/` (D-013) — but that source sits in a
    # different place in every environment: next to `backend/` when the test suite
    # runs on a host, a read-only mount in the containers, a copy baked into the
    # production image. Hence a variable with a default rather than a fixed path.
    app.instructions_dir: '%env(default:app_default_instructions_dir:WS_INSTRUCTIONS_DIR)%'
    app_default_instructions_dir: '%kernel.project_dir%/../plugin/shared'
    # The version the palace image was BUILT from — `MEMPALACE_VERSION` in the
    # root .env, which drives `pip install mempalace==...`. Deliberately not the
    # same fact as the version that answers: the two drift the moment somebody
    # edits .env without rebuilding, and the panel shows both so that gap is
    # visible (TODO-015). Read through the container so the application has one
    # way to reach configuration rather than two.
    mempalace.pinned_version: '%env(default::MEMPALACE_VERSION)%'
    # Where release information comes from. A parameter, not a constant: the test
    # suite points it at a port nothing listens on to prove that an unreachable
    # catalogue reports "nie udało się sprawdzić" rather than "brak aktualizacji".
    pypi.base_url: '%env(default:pypi_default_base_url:PYPI_URL)%'
    pypi_default_base_url: 'https://pypi.org/pypi'
    # The shared space every new account joins, and the role it joins with.
    # A knowledge base whose default state is "you belong to nothing" needs a
    # human to finish creating every account by hand; this is the company policy
    # spelled out as configuration. An empty slug switches it off, and accounts
    # then arrive with their private space only.
    app.default_space.slug: '%env(default:app_default_space_slug:WS_DEFAULT_SPACE_SLUG)%'
    app_default_space_slug: 'wiedza'
    app.default_space.name: '%env(default:app_default_space_name:WS_DEFAULT_SPACE_NAME)%'
    app_default_space_name: 'Baza wiedzy'
    # `writer`, because the point is that somebody can contribute the day they
    # arrive. An administrator can narrow one person afterwards; needing an
    # administrator before anybody can write is the thing being fixed.
    app.default_space.role: '%env(default:app_default_space_role:WS_DEFAULT_SPACE_ROLE)%'
    app_default_space_role: 'writer'
    # Short, because an administrator is watching a spinner and the scheduler has
    # nothing to gain from waiting longer. A check that hangs reads as a broken
    # panel; one that fails says to try again.
    pypi.timeout: 8.0

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/**/{Entity,ValueObject}'
            - '../src/Kernel.php'
            # The audit decorator implements McpTool, so registering it as a
            # service would get it tagged as a tool and injected into the registry
            # as one — a tool wrapping nothing. It is built by AuditedToolFactory.
            - '../src/Presentation/Mcp/AuditedTool.php'

    # Collected by tag, both of them: monitoring another dependency and offering
    # another MCP tool are each "add a class", never "edit five places".
    _instanceof:
        App\Domain\Health\HealthProbe:
            tags: ['app.health_probe']
        App\Presentation\Mcp\McpTool:
            tags: ['app.mcp_tool']

    App\Domain\Health\HealthChecker:
        arguments:
            $probes: !tagged_iterator app.health_probe

    App\Infrastructure\MemPalace\MemPalaceHealthProbe:
        arguments:
            $baseUrl: '%mempalace.base_url%'

    # Ports and the adapters behind them. Symfony can infer the alias while
    # exactly one class implements an interface; written down, a second adapter
    # — a cache, a read-only double — becomes a one-line change here instead of
    # a container that suddenly cannot decide.
    App\Domain\Memory\MemoryStore: '@App\Infrastructure\MemPalace\McpMemoryStore'
    App\Domain\Memory\MemoryRegistry: '@App\Infrastructure\Doctrine\DoctrineMemoryRegistry'
    App\Domain\Memory\LexicalIndex: '@App\Infrastructure\Doctrine\DoctrineLexicalIndex'
    App\Domain\Memory\MemoryBrowser: '@App\Infrastructure\Doctrine\DoctrineMemoryBrowser'
    App\Domain\Space\SpaceCatalog: '@App\Infrastructure\Doctrine\DoctrineSpaceCatalog'
    App\Domain\Space\SpaceMembershipRepository: '@App\Infrastructure\Doctrine\DoctrineSpaceMembershipRepository'
    App\Domain\Space\SpaceDirectory: '@App\Infrastructure\Doctrine\DoctrineSpaceDirectory'
    App\Domain\Identity\AgentTokenDirectory: '@App\Infrastructure\Doctrine\DoctrineAgentTokenDirectory'
    App\Domain\Identity\AuthorDirectory: '@App\Infrastructure\Doctrine\DoctrineAuthorDirectory'
    App\Domain\Identity\UserRoster: '@App\Infrastructure\Doctrine\DoctrineUserRoster'
    App\Domain\Identity\InvitationRoster: '@App\Infrastructure\Doctrine\DoctrineInvitationRoster'
    App\Domain\Instruction\InstructionLibrary: '@App\Infrastructure\Instruction\FileInstructionLibrary'
    App\Domain\Audit\AuditTrail: '@App\Infrastructure\Doctrine\DoctrineAuditTrail'
    App\Domain\Audit\AuditJournal: '@App\Infrastructure\Doctrine\DoctrineAuditJournal'
    App\Domain\Dependency\ReleaseCatalog: '@App\Infrastructure\PyPi\PyPiReleaseCatalog'
    App\Domain\Dependency\RunningVersion: '@App\Infrastructure\MemPalace\MemPalaceRunningVersion'
    App\Domain\Dependency\DependencyStateStore: '@App\Infrastructure\Doctrine\DoctrineDependencyStateStore'
    App\Domain\Dependency\UpdateRequestRepository: '@App\Infrastructure\Doctrine\DoctrineUpdateRequestRepository'
    App\Domain\Dependency\UpdaterHeartbeat: '@App\Infrastructure\Doctrine\DoctrineUpdaterHeartbeat'

    App\Infrastructure\Instruction\FileInstructionLibrary:
        arguments:
            $directory: '%app.instructions_dir%'

    App\Infrastructure\PyPi\PyPiReleaseCatalog:
        arguments:
            $baseUrl: '%pypi.base_url%'
            $timeoutSeconds: '%pypi.timeout%'

    App\Application\Dependency\DependencyCheckService:
        arguments:
            $pinnedVersion: '%mempalace.pinned_version%'

    App\Infrastructure\MemPalace\MemPalaceClient:
        arguments:
            $baseUrl: '%mempalace.base_url%'
            $token: '%mempalace.token%'
            $timeoutSeconds: '%mempalace.timeout%'

    # The registry wraps every tool in the audit decorator on the way in, so the
    # whole chain around a tool call is visible in one class rather than scattered
    # across container decorators.
    App\Presentation\Mcp\McpToolRegistry:
        arguments:
            $registered: !tagged_iterator app.mcp_tool

    App\Presentation\Mcp\McpController:
        arguments:
            $callsPerMinute: '%mcp.calls_per_minute%'

    App\Presentation\Console\InviteUserCommand:
        arguments:
            $publicBaseUrl: '%app.public_base_url%'

    App\Presentation\Console\IssueAgentTokenCommand:
        arguments:
            $publicBaseUrl: '%app.public_base_url%'

    App\Presentation\Api\AgentTokenController:
        arguments:
            $publicBaseUrl: '%app.public_base_url%'

    # Skalarów nie da się autowirować, więc te trzy muszą być podane wprost.
    #
    # Definicja jest TYLKO tutaj i tak ma zostać. Powtórzenie jej w `when@test`
    # (choćby po to, żeby dopisać `public: true`) **zastępuje** ten wpis, zamiast
    # się z nim scalić — usługa traci wtedy argumenty i cały zestaw testów pada na
    # autowiringu. W drugą stronę było tak samo: wpisana najpierw wyłącznie w
    # `when@test`, przechodziła testy i wywracała dev przy pierwszym żądaniu.
    # Upublicznianie jest tu zresztą niepotrzebne: usługę referencjonuje
    # `AcceptInvitation`, więc Symfony jej nie usunie jako nieużywanej.
    App\Application\Invitation\SharedSpaceForEveryone:
        arguments:
            $slug: '%app.default_space.slug%'
            $name: '%app.default_space.name%'
            $role: '%app.default_space.role%'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # Symfony removes services nothing references yet, and a use case
        # reachable only from a test looks exactly like that. We expose the few
        # the tests reach for, by name.
        #
        # Deliberately NOT a blanket `public: true` on App\: that turns every
        # value object and DTO into a service and the container then fails on
        # constructors it cannot autowire — SpaceId(string $value) and the like.
        App\Application\Invitation\IssueInvitation:
            public: true
        App\Application\Invitation\AcceptInvitation:
            public: true
        App\Domain\Space\SpaceAccessResolver:
            public: true
        App\Application\Memory\MemoryService:
            public: true
        App\Application\AgentToken\IssueAgentToken:
            public: true
        App\Application\AgentToken\RevokeAgentToken:
            public: true
        App\Presentation\Mcp\McpToolRegistry:
            public: true
            arguments:
                $registered: !tagged_iterator app.mcp_tool
        # The instruction library is reached directly by the test that compares
        # what the gateway serves with the files in plugin/shared. Arguments are
        # repeated because a second definition replaces the first one whole.
        App\Domain\Instruction\InstructionLibrary: '@App\Infrastructure\Instruction\FileInstructionLibrary'
        App\Infrastructure\Instruction\FileInstructionLibrary:
            public: true
            arguments:
                $directory: '%app.instructions_dir%'
        App\Domain\Memory\MemoryRegistry: '@App\Infrastructure\Doctrine\DoctrineMemoryRegistry'
        App\Domain\Space\SpaceCatalog: '@App\Infrastructure\Doctrine\DoctrineSpaceCatalog'
        App\Domain\Dependency\DependencyStateStore: '@App\Infrastructure\Doctrine\DoctrineDependencyStateStore'
        App\Infrastructure\Doctrine\DoctrineDependencyStateStore:
            public: true
        # The update half of TODO-015. Its interesting behaviour is concurrency —
        # a claim two agent runs cannot both win, an order the database refuses to
        # duplicate, a claimed order nobody came back from — and none of that is
        # reachable through HTTP, where the answer is one request at a time.
        App\Application\Dependency\UpdateRequestService:
            public: true
        App\Application\Dependency\UpdaterAgent:
            public: true
        App\Domain\Dependency\UpdateRequestRepository: '@App\Infrastructure\Doctrine\DoctrineUpdateRequestRepository'
        App\Infrastructure\Doctrine\DoctrineUpdateRequestRepository:
            public: true
        App\Domain\Dependency\UpdaterHeartbeat: '@App\Infrastructure\Doctrine\DoctrineUpdaterHeartbeat'
        App\Infrastructure\Doctrine\DoctrineUpdaterHeartbeat:
            public: true
