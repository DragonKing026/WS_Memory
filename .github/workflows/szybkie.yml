# Szybkie sprawdzenie — chodzi przy każdym pushu, na każdej gałęzi.
#
# Celowo NIE stawia serwera embeddingów ani całego stosu: od tego jest „Pełne
# sprawdzenie" (pelne.yml), które rusza na pull requeście i po scaleniu. Tutaj
# liczy się czas odpowiedzi — wynik ma przyjść, zanim autor przełączy kontekst.
#
# Wyzwalacz obejmuje wszystkie gałęzie, nie tylko main, i to jest istotne przy
# modelu „gałąź na zadanie" (D-031). Wcześniej stało tu `branches: [main]`, więc
# push na gałąź zadania nie uruchamiał niczego aż do otwarcia pull requesta —
# czyli feedback znikał dokładnie w chwili, gdy jest najbardziej potrzebny.
#
# Nie ma wyzwalacza `pull_request` i to również jest świadome: status przypina
# się do commita, więc przebieg z pusha widać w pull requeście dla tego samego
# SHA. Dodanie drugiego wyzwalacza dałoby dwa identyczne przebiegi na każdą
# zmianę. Skutek uboczny: pull request z **forka** nie dostanie tu żadnego
# sprawdzenia, a więc i nie da się go scalić. Kierunek jest bezpieczny, a gdy
# pojawią się zewnętrzni współautorzy, wyzwalacz wróci.

name: Szybkie sprawdzenie

on:
  push:

# Pull request z forka nie dostaje żadnych uprawnień poza odczytem.
permissions:
  contents: read

concurrency:
  # Nowszy push na tę samą gałąź unieważnia poprzedni przebieg — nikt nie
  # czeka na wynik dla kodu, którego już nie ma.
  group: szybkie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zakres:
    # Co właściwie zmieniła ta gałąź — żeby poprawka w samym frontendzie nie
    # budziła Postgresa, Composera i PHPStana.
    #
    # Liczone z różnicy wobec `main` (trzy kropki: od punktu rozejścia), a nie
    # z listy plików pojedynczego pusha. Gałąź zadania ma zwykle kilkanaście
    # commitów i liczy się jej całość: push poprawiający literówkę w README nie
    # może skasować faktu, że dziesięć commitów wcześniej zmieniono backend.
    name: Zakres zmian
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filtr.outputs.backend }}
      frontend: ${{ steps.filtr.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Pełna historia, inaczej nie ma jak wyznaczyć punktu rozejścia z main.
          fetch-depth: 0

      - name: Wyznacz zakres
        id: filtr
        run: |
          # Na main-ie nie ma się z czym porównywać i nie ma po co: stan gałęzi
          # głównej sprawdzamy w całości.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo 'Gałąź główna — uruchamiam wszystko.'
            echo 'backend=true' >> "$GITHUB_OUTPUT"
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main --quiet
          pliki=$(git diff --name-only origin/main...HEAD)

          if [ -z "$pliki" ]; then
            # Brak różnicy wobec main-a nie powinien się zdarzyć, ale gdyby —
            # sprawdzamy wszystko. Milczące pominięcie byłoby gorsze.
            echo 'Brak różnicy wobec main — uruchamiam wszystko na wszelki wypadek.'
            echo 'backend=true' >> "$GITHUB_OUTPUT"
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'Zmienione pliki:'
          echo "$pliki" | sed 's/^/  /'

          # docker-compose.yml i workflowy trafiają do OBU zakresów: potrafią
          # zepsuć każdą ze stron i nie ma jak z góry powiedzieć której.
          wzorzec_wspolny='^(docker-compose\.yml|\.github/workflows/|Makefile|\.env\.example)'

          # plugin/ jest w zakresie backendu, choć nie ma w nim ani linii PHP:
          # treść instrukcji z plugin/shared jest wystawiana przez gateway jako
          # zasoby MCP, a testy backendu porównują zasób z prawdziwym plikiem.
          # Zmiana samej instrukcji potrafi więc wywrócić PHPUnita — i musi to
          # zrobić na gałęzi, nie po scaleniu.
          if echo "$pliki" | grep -qE "^(backend/|docker/backend/|docker/postgres/|plugin/)|$wzorzec_wspolny"; then
            echo 'backend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'backend=false' >> "$GITHUB_OUTPUT"
          fi

          if echo "$pliki" | grep -qE "^(frontend/|docker/frontend/|docker/nginx/)|$wzorzec_wspolny"; then
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'frontend=false' >> "$GITHUB_OUTPUT"
          fi

          echo
          echo 'Zakres:'
          grep -E '^(backend|frontend)=' "$GITHUB_OUTPUT" | sed 's/^/  /'

  backend:
    name: Testy backendu
    needs: zakres
    if: needs.zakres.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ws_memory
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      APP_SECRET: ci-nie-jest-sekretem
      JWT_PASSPHRASE: ci-nie-jest-sekretem
      # Celowo nieosiągalny: endpoint zdrowia ma wtedy zgłosić pamięć jako
      # niedostępną, a test sprawdza kontrakt, nie stan świata.
      MEMPALACE_URL: http://127.0.0.1:9

    steps:
      - uses: actions/checkout@v7

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, sodium, zip
          coverage: none

      - name: Cache zależności Composera
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Instalacja zależności
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Schematy i role w bazie
        # Odwzorowanie docker/postgres/init: dwa schematy, dwie role z
        # rozdzielonym search_path. Rola ws_app celowo nie może pisać do
        # palace — testy mają działać na tych samych ograniczeniach co produkcja.
        env:
          PGPASSWORD: ci
        run: |
          psql -h 127.0.0.1 -U postgres -d ws_memory -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE SCHEMA IF NOT EXISTS palace;
          CREATE SCHEMA IF NOT EXISTS ws;
          CREATE ROLE ws_app LOGIN PASSWORD 'ci';
          GRANT USAGE, CREATE ON SCHEMA ws TO ws_app;
          GRANT USAGE ON SCHEMA public, palace TO ws_app;
          ALTER ROLE ws_app SET search_path = ws, public;
          SQL
          createdb -h 127.0.0.1 -U postgres ws_memory_test
          psql -h 127.0.0.1 -U postgres -d ws_memory_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE SCHEMA IF NOT EXISTS ws AUTHORIZATION ws_app;
          GRANT USAGE ON SCHEMA public TO ws_app;
          SQL

      - name: Klucze JWT
        working-directory: backend
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists
        env:
          DATABASE_URL: postgresql://ws_app:ci@127.0.0.1:5432/ws_memory?serverVersion=18&charset=utf8

      - name: Migracje
        working-directory: backend
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test
        env:
          DATABASE_URL: postgresql://ws_app:ci@127.0.0.1:5432/ws_memory?serverVersion=18&charset=utf8

      - name: PHPUnit
        working-directory: backend
        run: php vendor/bin/phpunit
        env:
          DATABASE_URL: postgresql://ws_app:ci@127.0.0.1:5432/ws_memory?serverVersion=18&charset=utf8

      - name: Składnia konfiguracji Symfony
        # lint:yaml rozumie znaczniki Symfony, w przeciwieństwie do zwykłego
        # parsera YAML.
        working-directory: backend
        run: php bin/console lint:yaml config --parse-tags
        env:
          DATABASE_URL: postgresql://ws_app:ci@127.0.0.1:5432/ws_memory?serverVersion=18&charset=utf8

      - name: Rozgrzej kontener dla analizy
        # phpstan-symfony czyta skompilowany kontener, żeby znać typy usług.
        # Lokalnie plik istnieje, bo aplikacja chodzi w Dockerze; na czystym
        # runnerze trzeba go najpierw wytworzyć.
        working-directory: backend
        run: php bin/console cache:warmup --env=dev
        env:
          APP_ENV: dev
          DATABASE_URL: postgresql://ws_app:ci@127.0.0.1:5432/ws_memory?serverVersion=18&charset=utf8

      - name: Analiza statyczna
        # CodeQL nie obsługuje PHP, a AI findings szuka podatności, nie błędów
        # poprawności (D-018). PHPStan zamyka tę drugą lukę — a w kodzie
        # uprawnień reguła zawsze zwracająca prawdę nie jest podatnością,
        # tylko cicho otwartymi drzwiami.
        working-directory: backend
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress
        env:
          DATABASE_URL: postgresql://ws_app:ci@127.0.0.1:5432/ws_memory?serverVersion=18&charset=utf8

  frontend:
    name: Testy frontendu
    needs: zakres
    if: needs.zakres.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          # Wskazanie pliku jest konieczne: akcja szuka pola "packageManager"
          # w package.json w KORZENIU repozytorium, a nasz frontend jest
          # w podkatalogu. Bez tego przebieg pada z „No pnpm version is
          # specified" — mimo że wersja jest zapisana tam, gdzie trzeba.
          package_json_file: frontend/package.json
          run_install: false

      - name: Cache zależności pnpm
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Instalacja zależności
        working-directory: frontend
        # --frozen-lockfile: przebieg, który po cichu rozwiązuje zależności
        # inaczej niż plik blokady, sprawdza inny kod niż ten, który pojedzie
        # na produkcję.
        run: pnpm install --frozen-lockfile

      - name: Typy
        working-directory: frontend
        # Osobny krok od testów, bo odpowiada na inne pytanie: testy mówią, czy
        # kod robi to, co ma, a vue-tsc — czy w ogóle da się go zbudować.
        run: pnpm typecheck

      - name: Testy jednostkowe
        working-directory: frontend
        run: pnpm test

      - name: Budowanie produkcyjne
        working-directory: frontend
        # Build bywa jedynym miejscem, gdzie wychodzi błąd konfiguracji Vite
        # albo brakujący import w komponencie ładowanym leniwie.
        run: pnpm build

  porzadek:
    name: Dokumentacja i zadania
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Spójność wersji polskiej i angielskiej
        run: ./scripts/sprawdz-dokumentacje.py

      - name: Rozliczenia ukończonych zadań
        run: ./scripts/sprawdz-zadania.py

      - name: Składnia PHP
        run: |
          # Tanie sito przed PHPStanem: literówka składniowa nie powinna
          # zajmować minuty na analizę statyczną.
          find backend/src backend/tests backend/migrations -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Składnia YAML workflowów
        # Tylko pliki workflow. Konfiguracji Symfony NIE sprawdzamy tutaj:
        # używa własnych znaczników (!tagged_iterator, !service), których
        # zwykły parser YAML nie zna i zgłasza jako błąd składni. Od tego jest
        # `lint:yaml` w zadaniu backendu, który te znaczniki rozumie.
        run: |
          python3 - <<'PY'
          import sys, pathlib
          try:
              import yaml
          except ImportError:
              print('brak pyyaml — pomijam'); sys.exit(0)
          bledy = 0
          for plik in pathlib.Path('.github/workflows').glob('*.y*ml'):
              try:
                  list(yaml.safe_load_all(plik.read_text(encoding='utf-8')))
              except Exception as e:
                  print(f'{plik}: {e}')
                  bledy += 1
          sys.exit(1 if bledy else 0)
          PY

  wynik:
    # Jedno zadanie, które zbiera wyniki pozostałych — i jedyne, którego ruleset
    # gałęzi głównej wymaga.
    #
    # Powód jest nieoczywisty i kosztowałby pół dnia szukania. Sprawdzenia mają
    # być zawężone ścieżkami: zmiana w samym frontendzie nie ma uruchamiać
    # PHPUnita ani PHPStana. Ale **pominięte zadanie nie zgłasza się jako
    # zielone** — z punktu widzenia reguły ochrony jest wiecznie oczekujące,
    # więc wymaganie go wprost zablokowałoby każdy pull request, który go nie
    # dotyczy. Bramka wykonuje się zawsze i sama decyduje, że pominięcie jest
    # w porządku, a porażka nie.
    name: Wynik sprawdzenia
    if: always()
    needs: [zakres, backend, frontend, porzadek]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Zbierz wyniki
        env:
          WYNIKI: |
            Zakres zmian=${{ needs.zakres.result }}
            Testy backendu=${{ needs.backend.result }}
            Testy frontendu=${{ needs.frontend.result }}
            Dokumentacja i zadania=${{ needs.porzadek.result }}
        run: |
          bledy=0
          while IFS='=' read -r nazwa wynik; do
            [ -n "$nazwa" ] || continue
            case "$wynik" in
              success)  echo "OK       $nazwa" ;;
              # Pominięte znaczy „ta zmiana tego nie dotyczy”, a nie „nie
              # sprawdziliśmy”. Zakres rozstrzyga zadanie wyznaczające zmiany.
              skipped)  echo "POMINIĘTE $nazwa (poza zakresem zmiany)" ;;
              *)        echo "BŁĄD     $nazwa: $wynik"; bledy=$((bledy + 1)) ;;
            esac
          done <<< "$WYNIKI"

          if [ "$bledy" -gt 0 ]; then
            echo
            echo "Nieudanych sprawdzeń: $bledy"
            exit 1
          fi

          echo
          echo "Wszystko, co dotyczyło tej zmiany, przeszło."
