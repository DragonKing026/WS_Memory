# Pełne sprawdzenie — cały stos, łącznie z modelem embeddingów i testami E2E.
#
# Odpowiada na pytanie, którego szybki przebieg celowo nie zadaje: czy cały
# system wstaje i czy polskie zapytanie znajduje polską treść. To założenie
# stoi u podstaw projektu (D-003) i jego złamanie jest CICHE — wyszukiwanie
# nadal działa, tylko przestaje trafiać.
#
# Chodzi przy KAŻDYM pushu, nie tylko nocą. Wcześniej było odwrotnie, bo
# pobranie modelu to ~2,3 GB i kilka minut — ale to była konsekwencja
# zepsutego cache'u, który zapisywał pusty katalog (patrz krok niżej).
# Z działającym cache'em pełny przebieg mieści się w kilku minutach, więc nie
# ma powodu, żeby odpowiedź „czy to w ogóle wstaje" czekała do rana.
#
# Harmonogram zostaje mimo to: raz na dobę przebieg ma się odbyć nawet bez
# commita. Zależności zewnętrzne psują się same — obraz znika, model przestaje
# być dostępny, PyPI się zmienia — a o takiej awarii lepiej wiedzieć rano niż
# przy najbliższej zmianie.

name: Pełne sprawdzenie

on:
  # Przed scaleniem, nie po nim. Początkowo ten przebieg ruszał wyłącznie na
  # main-ie i było to złe rozwiązanie: zmiana dotykająca testów E2E i konfiguracji
  # frontendu poszła do scalenia bez ani jednego uruchomienia pełnego stosu, bo
  # jedyne, co potrafi ją sprawdzić, chodziło dopiero po fakcie. Usterka
  # integracyjna wykryta minutę po scaleniu jest już usterką na main-ie.
  pull_request:
  # Po scaleniu również. Pull request sprawdza commit scalający, którego po
  # scaleniu na main-ie nie ma — a interesuje nas stan, który obowiązuje.
  push:
    branches: [main]
  schedule:
    # 03:17 UTC — nie o pełnej godzinie, bo wtedy kolejki GitHuba są najdłuższe.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Gałąź w nazwie grupy: bez niej przebieg dla pull requesta Dependabota
  # kasuje przebieg dla main i odwrotnie, a wtedy nie wiadomo, która zmiana
  # tak naprawdę przeszła.
  group: pelne-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pelny-stos:
    name: Pełny stos i polska semantyka
    runs-on: ubuntu-latest
    # Pobranie modelu przy zimnym cache potrafi trwać kilka minut; limit
    # z zapasem, ale nie nieskończony — zawieszony przebieg ma się skończyć.
    timeout-minutes: 30

    env:
      # Katalog hosta zamiast wolumenu nazwanego — jedyne, co `actions/cache`
      # umie zapamiętać. Na poziomie zadania, bo czyta to każde wywołanie
      # `docker compose`, także `down -v` przy sprzątaniu.
      EMBEDDING_CACHE_DIR: /tmp/model-embeddingow
      # Frontend zbudowany, nie serwer deweloperski — patrz krok „Frontend
      # w wersji produkcyjnej".
      FRONTEND_TARGET: prod

    steps:
      - uses: actions/checkout@v7

      - name: Przygotuj konfigurację
        run: |
          cp .env.example .env
          ./docker/wygeneruj-sekrety.sh

      - name: Nazwa modelu do klucza cache
        # Czytana z pliku, nie wpisana na sztywno. Poprzednio w kluczu stało
        # „bge-m3”, podczas gdy model bierze się z EMBEDDING_MODEL — zmiana
        # modelu nie unieważniłaby cache i przebieg sprawdzałby polską
        # semantykę na wagach poprzedniego modelu.
        id: model
        run: |
          nazwa=$(grep -E '^EMBEDDING_MODEL=' .env.example | cut -d= -f2- | tr '/' '-')
          test -n "$nazwa" || { echo "Brak EMBEDDING_MODEL w .env.example"; exit 1; }
          echo "klucz=$nazwa" >> "$GITHUB_OUTPUT"

      - name: Katalog na wagi modelu
        # Musi istnieć przed `actions/cache`, bo przy trafieniu akcja rozpakowuje
        # do niego, a przy pudle zapisuje go na końcu przebiegu. Serwer
        # embeddingów chodzi jako root, więc o prawa nie ma sporu.
        run: mkdir -p /tmp/model-embeddingow

      - name: Wagi modelu z poprzedniego przebiegu
        # Odczyt i zapis są tu ROZDZIELONE (`cache/restore` + `cache/save`
        # zamiast `cache`), i to nie jest kosmetyka — bez tego cache nie działa
        # wcale.
        #
        # `actions/cache` zapisuje dopiero w kroku końcowym i **tylko gdy
        # zadanie skończyło się sukcesem**. Nasze zadanie padało na testach E2E,
        # więc zapis nie następował nigdy. Powstała pułapka, która sama się
        # nakręca: jeden czerwony test blokuje cache na zawsze, a każdy kolejny
        # przebieg znowu pobiera 2,3 GB — i wygląda to dokładnie tak samo jak
        # cache, który działa. W liście cache'ów repozytorium nie było ani
        # jednego wpisu dla embeddingów przy 46 innych.
        #
        # (Wcześniej był jeszcze drugi błąd: krok wskazywał katalog hosta, a
        # model lądował w wolumenie nazwanym Dockera. Rozwiązuje to
        # `EMBEDDING_CACHE_DIR`.)
        id: cache-modelu
        uses: actions/cache/restore@v6
        with:
          path: /tmp/model-embeddingow
          key: embeddings-${{ steps.model.outputs.klucz }}-v2

      - name: Podnieś stos
        run: |
          docker compose up -d --wait --wait-timeout 900 postgres mempalace embeddings \
            || (docker compose logs --tail 50; exit 1)

      - name: Test polskiej semantyki
        # Sedno tego przebiegu. Zapisuje zdanie po polsku i szuka go frazą bez
        # wspólnych słów; przechodzi tylko wtedy, gdy wektory rozumieją polski.
        #
        # Identyfikator jest tu po to, żeby zapis cache'u niżej mógł się na nim
        # oprzeć: ten krok kończy się powodzeniem wyłącznie wtedy, gdy model
        # naprawdę się wczytał i liczy sensowne wektory.
        id: semantyka
        run: ./test/semantyka.sh

      - name: Backend i sprawdzenie zdrowia
        run: |
          # Kolejność ma znaczenie: worker konsumuje kolejkę, której tabelę
          # tworzy dopiero migracja. Wystartowany wcześniej wpada w pętlę
          # restartów i cały przebieg pada na jego stanie zdrowia.
          docker compose up -d --wait --wait-timeout 300 backend nginx
          # Obraz deweloperski celowo nie zawiera kodu ani zależności — źródła
          # są montowane wolumenem, żeby zmiana pliku na hoście była widoczna
          # od razu. Na czystym runnerze nie ma więc katalogu vendor.
          docker compose exec -T backend composer install --no-interaction --no-progress
          # Klucze JWT są w .gitignore — i słusznie, bo to sekret. Na czystym
          # runnerze trzeba je wygenerować, inaczej logowanie zwraca 500,
          # a testy uwierzytelniania sypią się na etapie tokena.
          docker compose exec -T backend php bin/console lexik:jwt:generate-keypair --skip-if-exists
          docker compose exec -T backend php bin/console doctrine:migrations:migrate --no-interaction
          docker compose up -d --wait --wait-timeout 120 worker
          # Tutaj — inaczej niż w szybkim przebiegu — oczekujemy 200:
          # wszystkie zależności mają działać naprawdę.
          kod=$(curl -s -o /tmp/zdrowie.json -w '%{http_code}' http://127.0.0.1:8080/api/health)
          cat /tmp/zdrowie.json
          test "$kod" = "200" || { echo "Endpoint zdrowia zwrócił $kod"; exit 1; }

      - name: Testy backendu na pełnym stosie
        run: make test

      - name: Frontend w wersji produkcyjnej
        # `FRONTEND_TARGET: prod`, czyli statyczne `dist/` serwowane przez nginx,
        # a nie serwer deweloperski Vite. Dwa powody, oba istotne.
        #
        # Po pierwsze, to jest artefakt, który naprawdę jedzie na serwer. Testy
        # E2E mają sprawdzać to, co wdrażamy.
        #
        # Po drugie, serwer deweloperski wnosił do przebiegu usterkę, której nie
        # ma na produkcji: Vite dopakowuje zależności w locie, a gdy odkrywał
        # `@codemirror/*` przy pierwszym wejściu na edytor, przepakowywał je,
        # zmieniał skrót w adresach i odpowiadał `504 Outdated Optimize Dep` na
        # żądania będące w locie. Ekran edytora był wtedy pusty. Na maszynie
        # dewelopera nie da się tego odtworzyć — skanowanie przy starcie wygrywa
        # wyścig — więc czerwone światło pojawiało się wyłącznie tutaj.
        #
        # Budowanie obrazu jest przy okazji sprawdzeniem samym w sobie: zawiera
        # `vue-tsc`, więc niezgodny typ zatrzymuje przebieg zamiast wyjść na
        # produkcji jako pusty ekran.
        run: |
          docker compose up -d --build --wait --wait-timeout 600 frontend
          docker compose up -d --wait --wait-timeout 120 nginx

      - name: Node 22 dla testów E2E
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Zależności frontendu na maszynie przebiegu
        # Na maszynie przebiegu, nie w kontenerze: Playwright potrzebuje
        # przeglądarki z bibliotekami systemowymi, których obraz Alpine nie ma.
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Przeglądarka dla Playwrighta
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Testy E2E
        working-directory: frontend
        env:
          WS_E2E_URL: http://127.0.0.1:8080
        run: pnpm test:e2e

      - name: Ślady z nieudanych testów E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-slady
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Zużycie pamięci przez usługi
        # Nie jest to asercja, tylko zapis w dzienniku przebiegu. Serwer
        # embeddingów potrafił kiedyś zająć 21 GB i zdławić maszynę; regularny
        # pomiar pokaże, gdyby zaczął rosnąć ponownie.
        if: always()
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'

      - name: Dzienniki przy niepowodzeniu
        if: failure()
        run: docker compose logs --tail 100

      - name: Zapisz wagi modelu na przyszłość
        # `always()`, bo zapis ma być NIEZALEŻNY od wyniku całego zadania —
        # w tym właśnie tkwił poprzedni błąd.
        #
        # Ale nie bezwarunkowo: zapisujemy tylko wtedy, gdy test semantyki
        # przeszedł. Wtedy wiadomo, że model wczytał się w całości. Zapisanie
        # cache'u po przerwanym pobieraniu utrwaliłoby uszkodzone pliki pod tym
        # samym kluczem i psuło każdy następny przebieg.
        #
        # Pomijamy też przy trafieniu, bo zapis pod istniejący klucz i tak by
        # się nie udał — a niepotrzebny błąd w dzienniku uczy ignorować dziennik.
        if: always() && steps.semantyka.conclusion == 'success' && steps.cache-modelu.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/model-embeddingow
          key: embeddings-${{ steps.model.outputs.klucz }}-v2

      - name: Sprzątanie
        if: always()
        run: docker compose down -v
