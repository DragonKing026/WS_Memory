# Dependabot — pilnowanie zależności.
#
# Cztery ekosystemy: pakiety PHP, pakiety npm frontendu, akcje GitHuba
# i obrazy Dockera.
#
# Aktualizacje są **grupowane**. Dwadzieścia osobnych pull requestów tygodniowo
# nikt nie przegląda, a nieprzeglądane PR-y to gorszy stan niż ich brak: dają
# złudzenie, że ktoś nad tym panuje.

version: 2

updates:
  # --- Backend PHP ------------------------------------------------------------
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'backend'
      include: scope
    groups:
      # Symfony aktualizuje się w komplecie — rozbicie na osobne PR-y daje
      # kombinacje wersji, których nikt nie testował.
      symfony:
        patterns:
          - 'symfony/*'
      doctrine:
        patterns:
          - 'doctrine/*'
      narzedzia-deweloperskie:
        dependency-type: development
    ignore:
      # Główne wersje Symfony i Doctrine to migracja, nie aktualizacja —
      # wchodzą świadomie, z własnym zadaniem w TODO.
      - dependency-name: 'symfony/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'doctrine/*'
        update-types: ['version-update:semver-major']

  # --- Frontend npm -----------------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'frontend'
      include: scope
    groups:
      # Vite ciągnie za sobą Rolldown i esbuild — rozbite na osobne PR-y dają
      # kombinacje, których nikt nie zbudował.
      vite:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitejs/*'
          - 'esbuild'
      vue:
        patterns:
          - 'vue'
          - 'vue-router'
          - 'vue-tsc'
          - 'pinia'
          - '@vue/*'
      ui:
        patterns:
          - '@nuxt/ui'
          - 'tailwindcss'
      narzedzia-deweloperskie:
        dependency-type: development
    ignore:
      # Główna wersja Vue albo Nuxt UI to migracja z własnym zadaniem, a nie
      # scalenie pull requesta w poniedziałek rano.
      - dependency-name: 'vue'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nuxt/ui'
        update-types: ['version-update:semver-major']
      # TypeScript 7 to przepisany rdzeń, a vue-tsc stoi na API poprzedniej
      # generacji (docs/07-frontend.md). Wchodzi świadomie, gdy vue-tsc nadrobi.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # --- Workflowy --------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Warsaw
    commit-message:
      prefix: 'ci'
    groups:
      akcje:
        patterns:
          - '*'

  # --- Obrazy Dockera ---------------------------------------------------------
  - package-ecosystem: docker
    directories:
      - /docker/backend
      - /docker/mempalace
      - /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Warsaw
    commit-message:
      prefix: 'infra'
    groups:
      obrazy:
        patterns:
          - '*'
    ignore:
      # Zmiana głównej wersji Postgresa to `pg_upgrade` i okno serwisowe,
      # a nie scalenie pull requesta.
      - dependency-name: 'pgvector/pgvector'
        update-types: ['version-update:semver-major']
      # MemPalace aktualizujemy świadomie: wymaga backupu bazy i przejścia
      # testu polskiej semantyki (docs/05-deployment.md). Dependabot ma o tym
      # informować, ale sam pull request nie jest zgodą na scalenie.
      - dependency-name: 'python'
        update-types: ['version-update:semver-major']
