# WS_Memory — fundament (TODO-000).
#
# Na tym etapie stoją trzy usługi: baza, serwer embeddingów i pamięć.
# Siedem usług: postgres, embeddings, mempalace, backend, worker, frontend, nginx.
#
# ŻADNA usługa nie ma mapowania portu na hosta (D-006). Jedynym wejściem z
# zewnątrz będzie nginx; do czasu jego dodania testujemy z wnętrza sieci:
#   docker compose exec mempalace curl -s localhost:8765/healthz
#
# KAŻDA usługa ma twardy limit pamięci. Nie jest to strojenie wydajności, tylko
# zabezpieczenie: kontener bez limitu weźmie całą pamięć maszyny. Przy pierwszym
# uruchomieniu serwer embeddingów zajął ~20 GB i zdławił komputer.

name: ws-memory

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ws_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
      MEMPALACE_DB_PASSWORD: ${MEMPALACE_DB_PASSWORD:?ustaw MEMPALACE_DB_PASSWORD w .env}
      WS_DB_PASSWORD: ${WS_DB_PASSWORD:?ustaw WS_DB_PASSWORD w .env}
    volumes:
      # Postgres 18+ trzyma dane w podkatalogu z numerem wersji, żeby
      # `pg_upgrade --link` nie przekraczał granicy montowania. Montujemy więc
      # /var/lib/postgresql, a NIE /var/lib/postgresql/data — obraz odmawia
      # startu, gdy zamontować to drugie.
      - postgres-dane:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-ws_memory}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  embeddings:
    # Wersja obrazu i nazwa modelu są przypięte świadomie: zmiana modelu
    # unieważnia wszystkie wektory w bazie (D-003).
    image: ${EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    restart: unless-stopped
    # Parametry bufora, NIE kosmetyka. bge-m3 przyjmuje 8192 tokenów, a TEI
    # rezerwuje pamięć proporcjonalnie do --max-batch-tokens razy liczba
    # wątków tokenizacji. Przy domyślnych wartościach (16384 tokenów, tyle
    # wątków ile rdzeni) zajęło to ~20 GB i zdławiło maszynę. Same wagi
    # modelu to ~2,3 GB — reszta była rezerwacją, której nie potrzebujemy:
    # szuflady pałaca to fragmenty tekstu, nie dokumenty na 8 tysięcy tokenów.
    command:
      - "--model-id"
      - "${EMBEDDING_MODEL:-BAAI/bge-m3}"
      - "--port"
      - "80"
      - "--max-batch-tokens"
      - "${EMBEDDING_MAX_BATCH_TOKENS:-2048}"
      - "--max-client-batch-size"
      - "${EMBEDDING_MAX_CLIENT_BATCH:-8}"
      - "--max-concurrent-requests"
      - "32"
      - "--tokenization-workers"
      - "${EMBEDDING_TOKENIZATION_WORKERS:-2}"
      - "--auto-truncate"
    volumes:
      # Domyślnie wolumen nazwany — na maszynie dewelopera model ma przetrwać
      # `docker compose down` i nikt nie chce 2,3 GB w katalogu projektu.
      #
      # Maszyna przebiegu ustawia tu katalog hosta, bo `actions/cache` potrafi
      # zapisać katalog, a wolumenu Dockera nie widzi. Bez tego przebieg nocny
      # pobierał model za każdym razem: krok cache istniał i wskazywał ścieżkę,
      # do której nic nigdy nie trafiało, więc zapisywał pustkę.
      - ${EMBEDDING_CACHE_DIR:-embeddings-cache}:/data
    # Twardy limit pamięci. Gdyby mimo strojenia usługa chciała więcej, ma
    # zginąć sama, a nie zabrać ze sobą maszynę. Kontener bez limitu weźmie
    # tyle, ile jest — i dokładnie to się stało przy pierwszym uruchomieniu.
    mem_limit: ${EMBEDDING_MEM_LIMIT:-4g}
    cpus: ${EMBEDDING_CPUS:-4}
    # Bez healthchecku: obraz nie zawiera narzędzi, którymi mógłby sprawdzić
    # sam siebie. Na gotowość czeka entrypoint usługi mempalace.

  mempalace:
    build:
      context: ./docker/mempalace
      args:
        MEMPALACE_VERSION: ${MEMPALACE_VERSION:-3.9.0}
    image: ws-memory/mempalace:${MEMPALACE_VERSION:-3.9.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      embeddings:
        condition: service_started
    environment:
      # Pałac mieszka w Postgresie razem z danymi aplikacji (D-002).
      MEMPALACE_BACKEND: pgvector
      MEMPALACE_PGVECTOR_DSN: postgresql://mempalace:${MEMPALACE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-ws_memory}
      # Wektory liczy jeden serwer dla całego systemu (D-003).
      MEMPALACE_EMBEDDING_MODEL: openai-compat
      MEMPALACE_EMBEDDING_API_URL: http://embeddings:80/v1/embeddings
      MEMPALACE_EMBEDDING_API_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      # Wykrywanie encji po polsku — domyślnie byłoby angielskie (D-011).
      MEMPALACE_ENTITY_LANGUAGES: ${MEMPALACE_ENTITY_LANGUAGES:-pl,en}
      MEMPALACE_MCP_HTTP_TOKEN: ${MEMPALACE_MCP_HTTP_TOKEN:?ustaw MEMPALACE_MCP_HTTP_TOKEN w .env}
      EMBEDDINGS_HEALTH_URL: http://embeddings:80/health
    # MemPalace nie reaguje na SIGTERM: Docker czekał dziesięć sekund i zabijał
    # go SIGKILL-em, co dawało kod wyjścia 137 wyglądający jak awaria. Na SIGINT
    # kończy się czysto w 0,2 sekundy (sprawdzone). Stąd ten sygnał — zamiast
    # wydłużania limitu, który i tak by nie pomógł.
    stop_signal: SIGINT
    volumes:
      - mempalace-dane:/data
    mem_limit: ${MEMPALACE_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf --max-time 5 http://localhost:8765/healthz || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: ${BACKEND_TARGET:-dev}
    image: ws-memory/backend:${BACKEND_TARGET:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mempalace:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:?ustaw APP_SECRET w .env}
      # Aplikacja łączy się rolą ws_app, która widzi swój schemat ws i CZYTA
      # palace. Do pałaca nigdy nie pisze — każdy zapis idzie przez MemPalace.
      DATABASE_URL: postgresql://ws_app:${WS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-ws_memory}?serverVersion=18&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      MEMPALACE_URL: http://mempalace:8765
      # Wersja PRZYPIĘTA, czyli ta, którą compose zbuduje. Aplikacja porównuje ją
      # z wersją, którą pałac naprawdę zgłasza przez MCP `initialize`. Rozjazd
      # znaczy, że ktoś zmienił `.env` i nie przebudował obrazu — panel ma to
      # pokazać. Bez przekazania zmiennej tutaj backend czytałby wartość
      # zastępczą z `backend/.env` i rozjazd byłby niewidoczny dokładnie wtedy,
      # gdy zaistnieje.
      MEMPALACE_VERSION: ${MEMPALACE_VERSION:-3.9.0}
      # Wspólna przestrzeń, do której trafia każde nowe konto — patrz .env.example.
      WS_DEFAULT_SPACE_SLUG: ${WS_DEFAULT_SPACE_SLUG:-wiedza}
      WS_DEFAULT_SPACE_NAME: ${WS_DEFAULT_SPACE_NAME:-Baza wiedzy}
      WS_DEFAULT_SPACE_ROLE: ${WS_DEFAULT_SPACE_ROLE:-writer}
      # Token do MemPalace zna WYŁĄCZNIE backend. Agenci dostają własne
      # tokeny wystawiane w aplikacji (reguła nienaruszalna nr 1).
      MEMPALACE_MCP_HTTP_TOKEN: ${MEMPALACE_MCP_HTTP_TOKEN}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?ustaw JWT_PASSPHRASE w .env}
      # Wysyłka maili (TODO-017). Bez MAILER_DSN system nic nie wysyła i nie
      # udaje, że wysyła — w dzienniku maili widać wpis nieudany z powodem.
      # WS_PUBLIC_URL jest tu obowiązkowe dla maili z linkami: link względny
      # w skrzynce nie prowadzi nigdzie.
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAIL_FROM: ${MAIL_FROM:-ws-memory@localhost}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Baza wiedzy}
      WS_PUBLIC_URL: ${WS_PUBLIC_URL:-}
      # Instrukcje dla agentów AI: protokół recall, zasady dokumentowania, opisy
      # podagentów. Treść ma JEDNO źródło w plugin/shared (D-013) i wychodzi na
      # świat jako zasoby MCP, więc zmiana instrukcji jest deployem serwera, a nie
      # aktualizacją wtyczki u każdej osoby. Obraz dev nie zawiera kodu — katalog
      # wchodzi wolumenem tylko do czytania; w obrazie prod jest skopiowany.
      WS_INSTRUCTIONS_DIR: /opt/ws-memory/instrukcje
    volumes:
      - ./backend:/app
      - ./plugin/shared:/opt/ws-memory/instrukcje:ro
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    # Dwa etapy w jednym Dockerfile: `dev` to Node z Vite i źródłami z wolumenu,
    # `prod` to nginx serwujący statyczne `dist/` — bez żadnego procesu Node.
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: ${FRONTEND_TARGET:-dev}
    image: ws-memory/frontend:${FRONTEND_TARGET:-dev}
    restart: unless-stopped
    environment:
      # Port, na którym przeglądarka widzi aplikację — websocket HMR musi być
      # ogłoszony na porcie nginxa, nie Vite, bo przeglądarka rozmawia z nginxem.
      WS_DEV_PORT: ${WS_DEV_PORT:-8080}
      # Node dobiera domyślny rozmiar sterty od pamięci kontenera — przy limicie
      # 1 GB wychodziło 549 MB, a `vue-tsc` przy obecnej liczbie plików potrzebuje
      # ~600 MB i wywracał się na „heap out of memory". Objaw jest mylący: wygląda
      # jak błąd typów, a jest brakiem pamięci, i dotyka każdego, kto uruchomi
      # sprawdzenie w kontenerze — łącznie ze skryptem wypychającym.
      #
      # Wartość świadomie niższa od limitu kontenera: gdy sterta może urosnąć do
      # granicy pamięci, proces ginie z ręki Dockera zamiast zgłosić własny błąd,
      # a wtedy w dzienniku nie ma nawet śladu po przyczynie.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1536}
    volumes:
      # Źródła z hosta, żeby zmiana pliku była widoczna od razu. W trybie prod ten
      # wolumen jest nieszkodliwy: obraz nie uruchamia Vite.
      - ./frontend:/app
      # Anonimowy wolumen na node_modules: bez niego katalog z hosta (pusty albo
      # zbudowany na inną architekturę) przysłoniłby ten z obrazu.
      - frontend_node_modules:/app/node_modules
    mem_limit: ${FRONTEND_MEM_LIMIT:-2g}
    healthcheck:
      # Vite odpowiada na HEAD dopiero po pierwszym przetworzeniu zależności,
      # dlatego start_period jest hojny.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  worker:
    # Ten sam obraz co backend, inny punkt wejścia — różni je tylko rola.
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: ${BACKEND_TARGET:-dev}
    image: ws-memory/backend:${BACKEND_TARGET:-dev}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Dwa transporty, jeden proces: `async` to zadania w tle (publikacja do
    # pałaca), `scheduler_dependencies` to sprawdzanie wersji co 6 godzin
    # (TODO-015). Harmonogram jest „stateful" — pamięta w cache, kiedy ostatnio
    # się wykonał — bo --time-limit restartuje ten proces co godzinę, a licznik
    # liczony od startu nigdy by nie doszedł do szóstej godziny.
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_dependencies", "--time-limit=3600", "--memory-limit=256M", "-v"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://ws_app:${WS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-ws_memory}?serverVersion=18&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      MEMPALACE_URL: http://mempalace:8765
      # Wersja PRZYPIĘTA, czyli ta, którą compose zbuduje. Aplikacja porównuje ją
      # z wersją, którą pałac naprawdę zgłasza przez MCP `initialize`. Rozjazd
      # znaczy, że ktoś zmienił `.env` i nie przebudował obrazu — panel ma to
      # pokazać. Bez przekazania zmiennej tutaj backend czytałby wartość
      # zastępczą z `backend/.env` i rozjazd byłby niewidoczny dokładnie wtedy,
      # gdy zaistnieje.
      MEMPALACE_VERSION: ${MEMPALACE_VERSION:-3.9.0}
      MEMPALACE_MCP_HTTP_TOKEN: ${MEMPALACE_MCP_HTTP_TOKEN}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?ustaw JWT_PASSPHRASE w .env}
      # Wysyłka maili (TODO-017). Bez MAILER_DSN system nic nie wysyła i nie
      # udaje, że wysyła — w dzienniku maili widać wpis nieudany z powodem.
      # WS_PUBLIC_URL jest tu obowiązkowe dla maili z linkami: link względny
      # w skrzynce nie prowadzi nigdzie.
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAIL_FROM: ${MAIL_FROM:-ws-memory@localhost}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Baza wiedzy}
      WS_PUBLIC_URL: ${WS_PUBLIC_URL:-}
      # Instrukcje dla agentów AI: protokół recall, zasady dokumentowania, opisy
      # podagentów. Treść ma JEDNO źródło w plugin/shared (D-013) i wychodzi na
      # świat jako zasoby MCP, więc zmiana instrukcji jest deployem serwera, a nie
      # aktualizacją wtyczki u każdej osoby. Obraz dev nie zawiera kodu — katalog
      # wchodzi wolumenem tylko do czytania; w obrazie prod jest skopiowany.
      WS_INSTRUCTIONS_DIR: /opt/ws-memory/instrukcje
    volumes:
      - ./backend:/app
      - ./plugin/shared:/opt/ws-memory/instrukcje:ro
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    healthcheck:
      # Konsument jest procesem numer 1 kontenera, więc pytamy wprost o niego.
      # pgrep wymagałby doinstalowania procps — po co pakiet, skoro /proc
      # odpowiada na to samo pytanie dokładniej.
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q messenger:consume"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        # service_started, nie service_healthy: pierwszy start Vite potrafi trwać
        # minutę, a nginx, który w tym czasie nie wstał, nie odpowiada nawet na
        # /api — czyli healthcheck backendu przez nginxa nigdy by nie przeszedł.
        condition: service_started
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/app/public:ro
    ports:
      # Jedyna usługa z portem na hoście (D-006). W dev tylko na pętli
      # zwrotnej — do sieci lokalnej nic nie wychodzi.
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Skrzynka na próby, TYLKO do pracy na własnej maszynie (profil `dev`).
  #
  # Bez niej jedynym sposobem sprawdzenia, czy zaproszenie naprawdę wychodzi
  # i czy link w treści działa, jest wysłanie go na prawdziwą skrzynkę — czyli
  # próba na cudzym serwerze i prawdziwy token w cudzej infrastrukturze.
  # Mailpit przyjmuje wszystko, nie wysyła nic dalej i pokazuje treść pod
  # http://127.0.0.1:8025.
  #
  # Za profilem, więc `docker compose up` jej NIE podnosi. Uruchamia się
  # świadomie: `docker compose --profile dev up -d mailpit`, a potem
  # MAILER_DSN=smtp://mailpit:1025 w .env. Na produkcji ten profil nie istnieje.
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # Bez tego skrzynka rośnie bez końca między przebiegami.
      MP_MAX_MESSAGES: 200
    ports:
      # Podgląd na pętli zwrotnej, tak jak nginx. Port SMTP zostaje wewnątrz
      # sieci Compose — nic z hosta nie ma powodu tam pisać.
      - "127.0.0.1:8025:8025"
    mem_limit: 128m

volumes:
  frontend_node_modules:
  postgres-dane:
  embeddings-cache:
  mempalace-dane:
